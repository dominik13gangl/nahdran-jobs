name: Jobs täglich aktualisieren

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Lint ausführen
        run: npm run lint

      - name: Öffentliche Jobquellen prüfen
        run: npm run jobs:update

      - name: Aktualisierten Stand bauen
        run: npm run build

      - name: Jobdaten versionieren
        run: |
          if git diff --quiet -- public/jobs.json; then
            echo "Keine Änderungen an den Jobdaten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json
          git commit -m "chore: update regional jobs"
          git push
